name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.8.6
      - name: Ruff check
        run: ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and dev extras
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest
      - name: Published test count matches the suite
        run: python scripts/check_test_count.py

  contracts:
    name: Contract and artifact checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Login event contract is valid JSON Schema
        run: python -c "import json;d=json.load(open('contracts/v1/login_event.schema.json'));assert d['title']=='LoginEvent';assert d['required']"
      - name: Published audit evidence carries no operator filesystem path
        run: |
          python - <<'PY'
          import json
          m = json.load(open("docs/artifacts/rba_offline/offline_run_manifest.json"))
          p = m["audit"]["source_path"]
          assert "\\" not in p and not p.startswith("/") and ":" not in p, p
          print("audit source_path is portable:", p)
          PY

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t authaudit:ci .
      - name: Container serves health
        run: |
          docker run -d --name authaudit-ci -p 8075:8075 -e HASH_SECRET=ci-secret authaudit:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8075/healthz; then echo; echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "health check failed"; docker logs authaudit-ci; exit 1
